<div class="container auth-page">
  <h1 class="h3 mb-4 text-center">Entrar</h1>

  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="card card-body shadow-sm" novalidate>
    <div class="mb-3">
      <label for="email" class="form-label">E-mail</label>
      <input
        id="email"
        type="email"
        class="form-control"
        formControlName="email"
        autocomplete="email"
        [class.is-invalid]="form.controls.email.touched && form.controls.email.invalid"
      />
      <div class="invalid-feedback">Informe um e-mail válido.</div>
    </div>

    <div class="mb-3">
      <label for="password" class="form-label">Senha</label>
      <input
        id="password"
        type="password"
        class="form-control"
        formControlName="password"
        autocomplete="current-password"
        [class.is-invalid]="form.controls.password.touched && form.controls.password.invalid"
      />
      <div class="invalid-feedback">Informe sua senha.</div>
    </div>

    @if (errorMessage) {
      <div class="alert alert-danger py-2" role="alert">{{ errorMessage }}</div>
    }

    <button type="submit" class="btn btn-primary w-100" [disabled]="loading">
      {{ loading ? 'Entrando...' : 'Entrar' }}
    </button>
  </form>

  <p class="text-center mt-3">Ainda não tem conta? <a routerLink="/cadastro">Cadastre-se</a></p>
</div>
