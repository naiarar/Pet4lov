services:
  postgres:
    container_name: pet4lov-postgres
    image: postgres:14
    restart: unless-stopped
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: password
      POSTGRES_DB: pet4lov
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U root -d pet4lov']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
