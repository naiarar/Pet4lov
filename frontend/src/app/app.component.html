<header>
  <nav class="navbar navbar-expand-md navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand fw-bold" routerLink="/">🐾 Pet4lov</a>
      <button
        class="navbar-toggler"
        type="button"
        aria-controls="main-nav"
        [attr.aria-expanded]="menuOpen"
        aria-label="Abrir menu"
        (click)="menuOpen = !menuOpen"
      >
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="main-nav" [class.show]="menuOpen">
        <ul class="navbar-nav me-auto">
          <li class="nav-item">
            <a class="nav-link" routerLink="/pets" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Pets</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="/ongs" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">ONGs</a>
          </li>
        </ul>

        <ul class="navbar-nav">
          @if (isLoggedIn$ | async) {
            <li class="nav-item">
              <a class="nav-link" routerLink="/minha-conta" routerLinkActive="active">Minha conta</a>
            </li>
            <li class="nav-item">
              <button type="button" class="btn btn-link nav-link" (click)="logout()">Sair</button>
            </li>
          } @else {
            <li class="nav-item">
              <a class="nav-link" routerLink="/login" routerLinkActive="active">Entrar</a>
            </li>
            <li class="nav-item">
              <a class="btn btn-primary ms-md-2" routerLink="/cadastro">Criar conta</a>
            </li>
          }
        </ul>
      </div>
    </div>
  </nav>
</header>

<main class="py-4">
  <router-outlet />
</main>

<footer class="border-top py-3 text-center text-body-secondary small">
  Pet4lov © {{ year }} · Conectando ONGs e adotantes
</footer>
